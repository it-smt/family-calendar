[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os
# The URL is taken from FC_DATABASE_URL at runtime; this is only a fallback.
sqlalchemy.url = postgresql+asyncpg://fc:fc@localhost:5432/family_calendar

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
