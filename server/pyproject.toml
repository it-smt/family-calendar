[project]
name = "family-calendar-server"
version = "0.1.0"
description = "Sync transport for the offline-first family calendar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    # Used at run time by the APNs client, not only by the tests.
    "httpx[http2]>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # The reference RFC 5545 implementation the recurrence fixtures are checked
    # against.
    "python-dateutil>=2.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
